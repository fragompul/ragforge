name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check code formatting with ruff
        run: ruff format --check src tests examples scripts web

      - name: Lint with ruff
        run: ruff check src tests examples scripts web

      - name: Type-check with mypy
        run: mypy src

      - name: Run tests with coverage threshold
        run: pytest --cov=ragforge --cov-report=term-missing --cov-fail-under=90

      - name: CLI smoke tests
        run: |
          ragforge benchmark
          ragforge demo --no-color

  zero-dependency:
    name: tests without NumPy (zero-dependency core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the package with test tooling only
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest hypothesis
      - name: Run tests (NumPy-dependent tests skip themselves)
        run: |
          python -c "import importlib.util as u; assert u.find_spec('numpy') is None, 'numpy must be absent'"
          pytest

  site:
    name: build web playground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check the ES modules
        run: |
          for f in web/js/*.js web/js/views/*.js; do
            node --input-type=module --check < "$f" || { echo "syntax error in $f"; exit 1; }
          done
      - name: Build site
        run: python scripts/build_site.py
      - name: Verify the shipped package zip imports
        run: |
          python - <<'PY'
          import sys, zipfile, tempfile
          with tempfile.TemporaryDirectory() as tmp:
              zipfile.ZipFile("site/py/ragforge.zip").extractall(tmp)
              sys.path.insert(0, tmp)
              import ragforge
              print("ragforge", ragforge.__version__, "imports from the site bundle")
          PY

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -t ragforge:ci .
      - name: Smoke test Docker container
        run: docker run --rm ragforge:ci demo --no-color
