name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check code formatting with ruff
        run: ruff format --check src tests examples scripts

      - name: Lint with ruff
        run: ruff check src tests examples scripts

      - name: Type-check with mypy
        run: mypy src

      - name: Run tests with coverage threshold
        run: pytest --cov=ragforge --cov-report=term-missing --cov-fail-under=90

      - name: CLI smoke test & benchmark
        run: ragforge benchmark

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t ragforge:ci .
      - name: Smoke test Docker container
        run: docker run --rm ragforge:ci benchmark

