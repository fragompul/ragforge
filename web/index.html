<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RagForge · Hybrid retrieval, forged from scratch</title>
  <meta name="description" content="Interactive playground for RagForge: hybrid BM25 + vector search, from-scratch HNSW, guardrails, verifiable citations and agentic RAG — the real Python library running in your browser.">
  <meta name="ragforge-build" content="{{BUILD}}">
  <meta name="theme-color" content="#090c15">
  <meta property="og:title" content="RagForge — hybrid retrieval, forged from scratch">
  <meta property="og:description" content="The real Python RAG library, running in your browser via WebAssembly. Hybrid search, HNSW, guardrails, citations, agents.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://raw.githubusercontent.com/fragompul/ragforge/main/docs/assets/social-preview.png">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/style.css?v={{BUILD}}">
  <script>
    // Apply the saved/system theme before first paint to avoid a flash.
    try {
      var t = JSON.parse(localStorage.getItem("ragforge.theme"));
      if (!t && window.matchMedia("(prefers-color-scheme: light)").matches) t = "light";
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="boot" id="boot" role="status" aria-live="polite">
    <div class="boot-inner">
      <img class="boot-logo" src="assets/logo.svg" alt="">
      <h2>Heating up the forge…</h2>
      <p id="boot-msg">Starting the Python runtime (WebAssembly)…</p>
      <div class="boot-bar"><i id="boot-bar"></i></div>
      <p class="hint">First load downloads ~10&nbsp;MB of Python; it is cached afterwards.</p>
      <p class="boot-err" id="boot-err"></p>
      <button class="btn" id="boot-retry" hidden>Reload</button>
      <noscript><p class="boot-err">RagForge needs JavaScript to run Python in your browser.</p></noscript>
    </div>
  </div>

  <header class="topbar">
    <a class="brand" href="#playground" aria-label="RagForge home"><img src="assets/logo.svg" alt=""><span>Rag<b>Forge</b></span></a>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
    <div class="top-actions">
      <span class="status"><span class="dot" id="status-dot"></span><span class="t" id="status-text">Starting Python…</span></span>
      <a class="icon-btn" href="https://github.com/fragompul/ragforge" target="_blank" rel="noopener" aria-label="GitHub repository" id="gh-btn"></a>
      <button class="icon-btn" id="theme-btn" aria-label="Toggle light/dark theme"></button>
    </div>
  </header>

  <main id="views"></main>

  <footer>
    <span>RagForge v{{VERSION}} · MIT licensed · <span id="build-label"></span></span>
    <span>Everything here executes locally in your browser. Documents you add never leave it.</span>
  </footer>

  <script>
    document.getElementById("gh-btn").innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.56v-2c-3.2.7-3.87-1.35-3.87-1.35-.52-1.33-1.28-1.69-1.28-1.69-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.04 0 0 .97-.31 3.17 1.18a10.9 10.9 0 0 1 5.78 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.58.23 2.75.11 3.04.74.81 1.18 1.83 1.18 3.09 0 4.42-2.69 5.39-5.26 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.68.8.56A11.5 11.5 0 0 0 12 .5z"/></svg>';
  </script>
  <script type="module" src="js/app.js?v={{BUILD}}"></script>
</body>
</html>
