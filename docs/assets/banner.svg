<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-label="RagForge — hybrid retrieval, forged from scratch">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f1a"/><stop offset="1" stop-color="#151a33"/></linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb020"/><stop offset=".55" stop-color="#ff6b2c"/><stop offset="1" stop-color="#f43f5e"/></linearGradient>
    <linearGradient id="cool" x1="0" x2="1"><stop offset="0" stop-color="#2dd4ef"/><stop offset="1" stop-color="#8b7cf6"/></linearGradient>
    <radialGradient id="glowA" cx=".12" cy=".05" r=".6"><stop offset="0" stop-color="#ff6b2c" stop-opacity=".30"/><stop offset="1" stop-color="#ff6b2c" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx=".95" cy=".1" r=".55"><stop offset="0" stop-color="#8b7cf6" stop-opacity=".30"/><stop offset="1" stop-color="#8b7cf6" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1280" height="400" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="22" fill="url(#glowA)"/>
  <rect width="1280" height="400" rx="22" fill="url(#glowB)"/>

  <!-- decorative HNSW-style graph, right side -->
  <g stroke="url(#cool)" stroke-opacity=".45" stroke-width="1.3" fill="none">
    <path d="M900 90 980 150 1070 110 1160 170 1090 250 1000 230 980 150M1070 110 1090 250M900 90 1000 230M1160 170 1210 260 1090 250M1000 230 1040 320 1090 250M1040 320 1130 330 1210 260"/>
  </g>
  <g fill="url(#cool)">
    <circle cx="900" cy="90" r="6"/><circle cx="980" cy="150" r="9"/><circle cx="1070" cy="110" r="7"/>
    <circle cx="1160" cy="170" r="8"/><circle cx="1090" cy="250" r="10"/><circle cx="1000" cy="230" r="6"/>
    <circle cx="1210" cy="260" r="5"/><circle cx="1040" cy="320" r="7"/><circle cx="1130" cy="330" r="5"/>
  </g>
  <circle cx="1090" cy="250" r="19" fill="none" stroke="#ff6b2c" stroke-width="2.5"/>
  <path d="M1090 232v-24M1090 268v24M1072 250h-24M1108 250h24" stroke="#ff6b2c" stroke-width="2.5" stroke-linecap="round"/>

  <!-- logo mark -->
  <g transform="translate(70 70) scale(2.6)">
    <path fill="url(#ember)" d="M4 30h38c10 0 16-3 18-8-1 11-6 16-16 17v3h6c2 0 3 1 3 3v6H17v-6c0-2 1-3 3-3h6v-3C14 41 8 36 4 30z"/>
    <path fill="#fff" fill-opacity=".22" d="M4 30h38c10 0 16-3 18-8-1 3-3 5-6 6.5-3 1.5-7 2.5-12 2.5H4z"/>
    <path d="M22 17 32 8l12 7M32 8v9" stroke="url(#cool)" stroke-width="2" stroke-linecap="round" fill="none"/>
    <g fill="url(#cool)"><circle cx="22" cy="17" r="3.2"/><circle cx="32" cy="8" r="3.6"/><circle cx="44" cy="15" r="3.2"/><circle cx="32" cy="17" r="2.4"/></g>
  </g>

  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <text x="260" y="130" font-size="78" font-weight="800" letter-spacing="-3" fill="#e9ecf6">Rag<tspan fill="url(#ember)">Forge</tspan></text>
    <text x="262" y="182" font-size="27" font-weight="600" fill="#c3c9df">Hybrid retrieval, forged from scratch.</text>
    <text x="262" y="222" font-size="18" fill="#8d96b3">BM25 + vectors with RRF · from-scratch HNSW · guardrails · verifiable citations</text>
    <text x="262" y="250" font-size="18" fill="#8d96b3">agentic RAG · MCP server · evaluation on public benchmarks · zero dependencies</text>
    <g font-size="15" font-weight="700">
      <rect x="70" y="316" width="156" height="38" rx="19" fill="#ff6b2c" fill-opacity=".14" stroke="#ff6b2c" stroke-opacity=".6"/>
      <text x="148" y="341" text-anchor="middle" fill="#ff9a66">nDCG@10 0.705</text>
      <rect x="240" y="316" width="196" height="38" rx="19" fill="#2dd4ef" fill-opacity=".10" stroke="#2dd4ef" stroke-opacity=".5"/>
      <text x="338" y="341" text-anchor="middle" fill="#6fe0f3">HNSW recall 0.99</text>
      <rect x="450" y="316" width="172" height="38" rx="19" fill="#34d399" fill-opacity=".10" stroke="#34d399" stroke-opacity=".5"/>
      <text x="536" y="341" text-anchor="middle" fill="#6ee7b7">96% coverage</text>
      <rect x="636" y="316" width="190" height="38" rx="19" fill="#8b7cf6" fill-opacity=".12" stroke="#8b7cf6" stroke-opacity=".5"/>
      <text x="731" y="341" text-anchor="middle" fill="#b0a6fa">mypy --strict</text>
    </g>
  </g>
</svg>
