[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragforge"
version = "0.1.0"
description = "Production-hardened RAG pipeline: multi-strategy chunking, hybrid search (BM25 + vector RRF), reranking, metadata filtering, and RAGAS-style evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Francisco Javier Gómez Pulido" }]
dependencies = []

[project.scripts]
ragforge = "ragforge.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "hypothesis>=6.100",
]
# Real embedding providers (see src/ragforge/embeddings_providers.py). Each is
# fully optional and lazily imported -- core ragforge has zero dependencies.
openai = ["openai>=1.0"]
cohere = ["cohere>=5.0"]
local = ["sentence-transformers>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["ragforge"]
branch = true
omit = ["tests/*", "examples/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W", "C4"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# This script's return value is a long Markdown document (table rows, URLs)
# assembled in an f-string -- individual generated-content lines legitimately
# exceed 100 chars; the code around them still follows the line-length limit.
"scripts/generate_benchmarks.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
ignore_missing_imports = true

