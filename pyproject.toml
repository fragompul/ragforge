[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragforge"
dynamic = ["version"]
description = "Zero-dependency hybrid RAG toolkit: BM25 + vector search with RRF, from-scratch HNSW, guardrails, verifiable citations, agentic retrieval, evaluation and an MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Francisco Javier Gómez Pulido" }]
keywords = [
    "rag", "retrieval-augmented-generation", "hybrid-search", "bm25", "hnsw", "llm",
    "reranking", "mcp", "model-context-protocol", "agentic-rag", "evaluation", "guardrails",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/fragompul/ragforge"
Demo = "https://fragompul.github.io/ragforge/"
Documentation = "https://github.com/fragompul/ragforge/tree/main/docs"
Changelog = "https://github.com/fragompul/ragforge/blob/main/CHANGELOG.md"
Issues = "https://github.com/fragompul/ragforge/issues"

[project.scripts]
ragforge = "ragforge.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "hypothesis>=6.170.1",
    "numpy>=1.26",
]
# Everything below is optional and lazily imported -- core ragforge has zero dependencies.
# NumPy-accelerated exact vector search (ragforge.fast.NumpyVectorIndex).
fast = ["numpy>=1.26"]
# Real embedding / LLM providers (see embeddings_providers.py and llm_providers.py).
openai = ["openai>=1.0"]
cohere = ["cohere>=5.0"]
anthropic = ["anthropic>=0.40"]
local = ["sentence-transformers>=3.0"]
# Documentation site (mkdocs build --strict).
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5"]

[tool.setuptools.dynamic]
version = { attr = "ragforge._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ragforge = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["ragforge"]
branch = true
omit = ["tests/*", "examples/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W", "C4"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# This script's return value is a long Markdown document (table rows, URLs)
# assembled in an f-string -- individual generated-content lines legitimately
# exceed 100 chars; the code around them still follows the line-length limit.
"scripts/generate_benchmarks.py" = ["E501"]
"scripts/eval_*.py" = ["E501"]
"scripts/make_notebook.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
ignore_missing_imports = true

